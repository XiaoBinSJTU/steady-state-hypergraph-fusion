[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steady-state-hypergraph-fusion"
version = "0.1.0"
description = "Research reference implementation of steady-state guided spatiotemporal hypergraph fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "torch>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
